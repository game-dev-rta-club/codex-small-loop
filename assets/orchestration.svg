<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title description">
  <title id="title">Codex Small Loop orchestration</title>
  <desc id="description">A user request enters a Controller that communicates with the user. The Controller delegates a milestone to a Primary hub. Primary coordinates Execute and Interview tasks, then four independent reviews. Required corrections loop back through Primary before Controller delivers a verified result.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="controller" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6658d3"/>
      <stop offset="1" stop-color="#5142b8"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2676a8"/>
      <stop offset="1" stop-color="#165b86"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37a56f"/>
      <stop offset="1" stop-color="#218557"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#24334f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#77819a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6658d3"/>
    </marker>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 750; letter-spacing: 2px; }
      .title { font-size: 34px; font-weight: 760; }
      .body { font-size: 20px; font-weight: 500; }
      .small { font-size: 17px; font-weight: 560; }
      .line { fill: none; stroke: #77819a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .coordinate { fill: none; stroke: #2676a8; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 10 10; }
    </style>
  </defs>

  <rect width="1600" height="940" rx="36" fill="url(#background)"/>
  <circle cx="1460" cy="120" r="150" fill="#f4c96b" opacity="0.16"/>
  <circle cx="120" cy="830" r="190" fill="#6658d3" opacity="0.08"/>

  <text x="80" y="78" class="label eyebrow" fill="#6658d3">ONE REQUEST · ONE CONTROL PLANE · REVIEWED DELIVERY</text>
  <text x="80" y="126" class="label title" fill="#20283a">A small loop, coordinated entirely inside Codex</text>

  <g filter="url(#shadow)">
    <rect x="80" y="206" width="276" height="154" rx="26" fill="#ffffff" stroke="#d9dcec" stroke-width="2"/>
    <rect x="80" y="206" width="10" height="154" rx="5" fill="#f2a54a"/>
    <text x="116" y="250" class="label eyebrow" fill="#b36b1c">REQUEST</text>
    <text x="116" y="292" class="label body" fill="#263044">Investigate the bug,</text>
    <text x="116" y="322" class="label body" fill="#263044">fix it, and verify it.</text>
  </g>

  <path d="M356 283 H430" class="line"/>

  <g filter="url(#shadow)">
    <rect x="450" y="190" width="300" height="186" rx="28" fill="url(#controller)"/>
    <text x="486" y="240" class="label eyebrow" fill="#dad5ff">CONTROLLER</text>
    <text x="486" y="289" class="label title" fill="#ffffff">Owns the loop</text>
    <text x="486" y="326" class="label body" fill="#edeaff">Plans · supervises · reports</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="468" y="458" width="264" height="108" rx="24" fill="#ffffff" stroke="#cfc9f4" stroke-width="2"/>
    <circle cx="510" cy="512" r="20" fill="#f2a54a"/>
    <circle cx="510" cy="505" r="7" fill="#ffffff"/>
    <path d="M498 524 Q510 514 522 524" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="548" y="505" class="label eyebrow" fill="#6658d3">YOU</text>
    <text x="548" y="534" class="label small" fill="#4d566b">Decide material questions</text>
  </g>
  <path d="M600 376 V458" fill="none" stroke="#6658d3" stroke-width="4" stroke-linecap="round" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <text x="619" y="425" class="label small" fill="#6658d3">interview &amp; updates</text>

  <path d="M750 283 H826" class="line"/>

  <g filter="url(#shadow)">
    <rect x="846" y="190" width="300" height="186" rx="28" fill="url(#primary)"/>
    <text x="882" y="240" class="label eyebrow" fill="#cdeeff">PRIMARY</text>
    <text x="882" y="289" class="label title" fill="#ffffff">Milestone hub</text>
    <text x="882" y="326" class="label body" fill="#dff4ff">Coordinates focused agents</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="800" y="474" width="236" height="114" rx="24" fill="#ffffff" stroke="#abd3e8" stroke-width="2"/>
    <circle cx="840" cy="516" r="16" fill="#2676a8"/>
    <path d="M833 516 L838 521 L848 509" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="870" y="515" class="label eyebrow" fill="#165b86">EXECUTE</text>
    <text x="832" y="555" class="label small" fill="#4d566b">Implement &amp; test</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1064" y="474" width="236" height="114" rx="24" fill="#ffffff" stroke="#abd3e8" stroke-width="2"/>
    <circle cx="1104" cy="516" r="16" fill="#f2a54a"/>
    <text x="1099" y="523" class="label body" font-weight="800" fill="#ffffff">?</text>
    <text x="1134" y="515" class="label eyebrow" fill="#9c5b18">INTERVIEW</text>
    <text x="1095" y="555" class="label small" fill="#4d566b">Resolve a material gap</text>
  </g>

  <path d="M996 376 V430 H918 V474" class="coordinate"/>
  <path d="M996 430 H1182 V474" class="coordinate"/>

  <g filter="url(#shadow)">
    <rect x="758" y="680" width="440" height="168" rx="30" fill="#ffffff" stroke="#cfc9f4" stroke-width="2"/>
    <text x="794" y="724" class="label eyebrow" fill="#6658d3">MULTI REVIEW</text>
    <text x="794" y="756" class="label small" fill="#596277">Four independent checks</text>

    <rect x="794" y="783" width="88" height="40" rx="13" fill="#f0edff"/>
    <text x="805" y="809" class="label" font-size="15" font-weight="600" fill="#5142b8">Baseline</text>
    <rect x="892" y="783" width="76" height="40" rx="13" fill="#e9f7ff"/>
    <text x="912" y="809" class="label" font-size="15" font-weight="600" fill="#165b86">Trust</text>
    <rect x="978" y="783" width="92" height="40" rx="13" fill="#fff3df"/>
    <text x="990" y="809" class="label" font-size="15" font-weight="600" fill="#9c5b18">Technical</text>
    <rect x="1080" y="783" width="82" height="40" rx="13" fill="#e8f7ef"/>
    <text x="1089" y="809" class="label" font-size="15" font-weight="600" fill="#218557">Customer</text>
  </g>

  <path d="M918 588 V636 H1050 V680" class="line"/>
  <path d="M1182 588 V636 H1050" fill="none" stroke="#77819a" stroke-width="4" stroke-linecap="round"/>
  <path d="M758 764 C684 764 686 410 846 342" fill="none" stroke="#6658d3" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#arrow-purple)"/>
  <text x="562" y="694" class="label small" fill="#6658d3">required correction</text>

  <path d="M1198 764 H1230" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1250" y="680" width="270" height="168" rx="28" fill="url(#result)"/>
    <circle cx="1290" cy="726" r="18" fill="#ffffff" opacity="0.95"/>
    <path d="M1281 726 L1288 733 L1301 717" fill="none" stroke="#218557" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1320" y="733" class="label eyebrow" fill="#e8fff3">DELIVERED</text>
    <text x="1286" y="782" class="label title" fill="#ffffff">Verified result</text>
    <text x="1286" y="817" class="label body" fill="#e5fff0">Evidence included</text>
  </g>

  <text x="80" y="902" class="label small" fill="#6a7388">Codex Desktop is the control plane. No separate orchestration service is required.</text>
</svg>
