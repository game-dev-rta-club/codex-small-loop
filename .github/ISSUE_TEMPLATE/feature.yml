name: Feature request
description: Propose an improvement to the Codex Small Loop workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring development workflow or failure should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest observable change that would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What existing Codex prompts, skills, or workflows address part of the problem?
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note effects on macOS, Windows, plugin installation, or existing projects.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for a similar request.
          required: true
