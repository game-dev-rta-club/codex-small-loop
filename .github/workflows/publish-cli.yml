name: Publish CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: macos-14
            suite: darwin
          - os: windows-2022
            suite: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node implementation/testing/test-runner.mjs ${{ matrix.suite }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release tag
        run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== `cli-v${p.version}`) process.exit(1);'
      - name: Publish through npm trusted publishing
        run: npm publish --access public --provenance --ignore-scripts
